name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - run: cp ThirdPartyKeys.example.plist ThirdPartyKeys.plist

      - run: sudo gem install cocoapods

      - run: pod install

      - name: Archive
        run: |
          set -eo pipefail
          xcodebuild \
            -workspace swift-ui-base.xcworkspace \
            -scheme swift-ui-base \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/swift-ui-base.xcarchive \
            archive

      - name: Export IPA
        run: |
          set -eo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/swift-ui-base.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-ui-base-ipa
          path: build/export

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcarchive
          path: build/swift-ui-base.xcarchive
