name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ThirdPartyKeys.plist
        run: cp ThirdPartyKeys.example.plist ThirdPartyKeys.plist

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install Pods
        run: pod install

      - name: Archive
        run: |
          set -eo pipefail

          xcodebuild \
            -workspace swift-ui-base.xcworkspace \
            -scheme swift-ui-base \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/swift-ui-base.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          set -eo pipefail

          mkdir -p Payload

          cp -R \
            build/swift-ui-base.xcarchive/Products/Applications/swift-ui-base.app \
            Payload/

          /usr/bin/zip -qry swift-ui-base.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: swift-ui-base-ipa
          path: swift-ui-base.ipa

      - name: Upload Archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcarchive
          path: build/swift-ui-base.xcarchive
